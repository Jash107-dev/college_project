{% extends 'base.html' %}
{% block title %}Employee Login - EMS{% endblock %}

{% block login_content %}

<div class="login-wrapper">
    <div class="login-card">

        <div class="brand">
            <div class="brand-logo emp">E</div>
            <h1 class="brand-name">Employee Login</h1>
            <p class="brand-sub">We'll send a one-time password to your registered email</p>
        </div>

        <form method="post" class="login-form">
            {% csrf_token %}

            {% if error %}
            <div class="error-box">
                <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"/>
                    <path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
                </svg>
                {{ error }}
            </div>
            {% endif %}

            <div class="input-group">
                <svg class="input-icon" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0"/>
                </svg>
                <input type="text" name="employee_id" placeholder="Employee ID (e.g. EMP001)"
                       required autofocus autocomplete="off"
                       style="text-transform:uppercase;">
            </div>

            <button type="submit" class="btn-submit">Send OTP</button>
        </form>

        <div class="divider"><span>or</span></div>

        <a href="{% url 'login' %}" class="btn-admin-link">
            <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
            </svg>
            Admin Login
        </a>

    </div>
</div>

<style>
.login-wrapper {
    display: flex; align-items: center; justify-content: center;
    width: 100vw; height: 100vh;
    background: #eeefff;
    font-family: 'Inter', sans-serif;
    position: fixed; top: 0; left: 0;
    padding: 20px; box-sizing: border-box;
}
.login-card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 6px 20px rgba(0,0,0,0.08);
    padding: 40px 44px;
    width: 100%; max-width: 420px;
    display: flex; flex-direction: column; align-items: center;
}
.brand {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 28px; gap: 6px; text-align: center;
}
.brand-logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 700; color: white;
    box-shadow: 0 4px 14px rgba(99,102,241,0.4);
}
.brand-logo.emp {
    background: linear-gradient(135deg, #10b981, #059669);
    box-shadow: 0 4px 14px rgba(16,185,129,0.4);
}
.brand-name { font-size: 20px; font-weight: 700; color: #1a1a2e; margin: 0; }
.brand-sub  { font-size: 12px; color: #9ca3af; margin: 0; }

.login-form {
    width: 100%; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.error-box {
    width: 100%; background: #fee2e2; color: #991b1b;
    border: 1px solid #fca5a5; border-radius: 10px;
    padding: 10px 14px; font-size: 12px;
    display: flex; align-items: center; gap: 8px;
}
.input-group { position: relative; width: 100%; }
.input-group input {
    width: 100%; padding: 12px 14px 12px 42px;
    border: 2px solid #e5e7eb; border-radius: 10px;
    font-size: 13px; font-family: 'Inter', sans-serif;
    outline: none; background: #f9fafb; color: #111827;
    transition: all 0.2s; box-sizing: border-box;
}
.input-group input:focus {
    border-color: #10b981; background: #fff;
    box-shadow: 0 0 0 3px rgba(16,185,129,0.12);
}
.input-icon {
    position: absolute; left: 13px; top: 50%;
    transform: translateY(-50%); color: #9ca3af; pointer-events: none;
}
.btn-submit {
    width: 100%; padding: 12px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 14px rgba(16,185,129,0.4);
    transition: opacity 0.2s, transform 0.2s; margin-top: 4px;
}
.btn-submit:hover { opacity: 0.92; transform: translateY(-1px); }
.btn-submit:active { transform: translateY(0); }

.divider {
    width: 100%; display: flex; align-items: center; gap: 12px;
    margin: 20px 0 16px; color: #d1d5db; font-size: 12px;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
.divider span { color: #9ca3af; white-space: nowrap; }

.btn-admin-link {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; padding: 11px;
    border: 2px solid #6366f1; border-radius: 10px;
    color: #6366f1; font-size: 13px; font-weight: 600;
    text-decoration: none; font-family: 'Inter', sans-serif;
    transition: all 0.2s;
}
.btn-admin-link:hover { background: #eef2ff; border-color: #4f46e5; }
</style>

{% endblock %}
