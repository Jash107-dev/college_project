{% extends 'base.html' %}
{% block title %}Export Employees - EMS{% endblock %}
{% block nav_export %}active{% endblock %}

{% block content %}

<div class="page-header">
    <h1 class="page-title">Export Employees</h1>
    <p class="page-subtitle">Customize filters and select columns to export</p>
</div>

<div class="export-container">
    <form method="get" action="{% url 'export_csv' %}" id="export-form">
        
        <!-- Filters Section -->
        <div class="export-section">
            <h3 class="section-title">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/>
                </svg>
                Filter Employees
            </h3>
            
            <div class="filter-grid">
                <div class="filter-item">
                    <label>Department</label>
                    <select name="department">
                        <option value="">All Departments</option>
                        {% for code, name in departments %}
                        <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-item">
                    <label>Status</label>
                    <select name="status">
                        <option value="">All Statuses</option>
                        {% for code, name in statuses %}
                        <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="filter-item">
                    <label>Salary Range (Min)</label>
                    <input type="number" name="salary_min" placeholder="e.g. 30000">
                </div>

                <div class="filter-item">
                    <label>Salary Range (Max)</label>
                    <input type="number" name="salary_max" placeholder="e.g. 100000">
                </div>

                <div class="filter-item">
                    <label>Joined From</label>
                    <input type="date" name="date_from">
                </div>

                <div class="filter-item">
                    <label>Joined To</label>
                    <input type="date" name="date_to">
                </div>
            </div>
        </div>

        <!-- Column Selection -->
        <div class="export-section">
            <h3 class="section-title">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                Select Columns to Export
            </h3>

            <div class="columns-grid">
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="employee_id" checked>
                    <span>Employee ID</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="name" checked>
                    <span>Name</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="email" checked>
                    <span>Email</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="phone" checked>
                    <span>Phone</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="gender" checked>
                    <span>Gender</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="department" checked>
                    <span>Department</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="designation" checked>
                    <span>Designation</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="salary" checked>
                    <span>Salary</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="date_of_joining" checked>
                    <span>Date of Joining</span>
                </label>
                <label class="column-checkbox">
                    <input type="checkbox" name="col" value="status" checked>
                    <span>Status</span>
                </label>
            </div>

            <div class="column-actions">
                <button type="button" onclick="selectAllColumns()" class="btn-link">Select All</button>
                <button type="button" onclick="deselectAllColumns()" class="btn-link">Deselect All</button>
            </div>
        </div>

        <!-- Hidden field for columns (populated by JS) -->
        <input type="hidden" name="columns" id="columns-input">

        <!-- Export Button -->
        <div class="export-actions">
            <button type="submit" class="btn-export">
                <svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Export CSV
            </button>
            <a href="{% url 'employee_list' %}" class="btn-cancel">Cancel</a>
        </div>

    </form>
</div>

<style>
.page-header {
    margin-bottom: 28px;
}
.page-title {
    font-size: 26px; font-weight: 700; color: var(--text); margin: 0 0 4px;
}
.page-subtitle {
    font-size: 14px; color: var(--text-secondary); margin: 0;
}

.export-container {
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px;
}

.export-section {
    margin-bottom: 32px;
    padding-bottom: 32px;
    border-bottom: 2px solid var(--border-light);
}
.export-section:last-of-type {
    border-bottom: none;
    margin-bottom: 0;
    padding-bottom: 0;
}

.section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 18px; font-weight: 600; color: var(--text);
    margin: 0 0 20px;
}
.section-title svg {
    color: var(--accent);
}

.filter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
}

.filter-item label {
    display: block;
    font-size: 13px; font-weight: 500; color: var(--text-secondary);
    margin-bottom: 6px;
}

.filter-item input,
.filter-item select {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: white;
    transition: all 0.15s;
}

.filter-item input:focus,
.filter-item select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
}

.columns-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
}

.column-checkbox {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: var(--text);
}

.column-checkbox:hover {
    border-color: var(--accent);
    background: var(--accent-light);
}

.column-checkbox input[type="checkbox"] {
    width: 16px; height: 16px;
    cursor: pointer;
}

.column-checkbox input[type="checkbox"]:checked + span {
    font-weight: 600;
    color: var(--accent);
}

.column-actions {
    margin-top: 16px;
    display: flex; gap: 16px;
}

.btn-link {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
}
.btn-link:hover {
    color: var(--accent-dark);
}

.export-actions {
    display: flex; gap: 12px; align-items: center;
    margin-top: 32px;
}

.btn-export {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 24px;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    box-shadow: 0 4px 14px rgba(99,102,241,0.4);
    transition: all 0.2s;
}
.btn-export:hover {
    opacity: 0.92;
    transform: translateY(-1px);
}

.btn-cancel {
    padding: 12px 24px;
    background: transparent;
    color: var(--text-secondary);
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.15s;
}
.btn-cancel:hover {
    border-color: var(--text-secondary);
    color: var(--text);
}
</style>

<script>
// Collect selected columns and populate hidden input before submit
document.getElementById('export-form').addEventListener('submit', function(e) {
    var checkboxes = document.querySelectorAll('input[name="col"]:checked');
    var selected = Array.from(checkboxes).map(cb => cb.value);
    
    if (selected.length === 0) {
        e.preventDefault();
        alert('Please select at least one column to export.');
        return;
    }
    
    document.getElementById('columns-input').value = selected.join(',');
});

function selectAllColumns() {
    document.querySelectorAll('input[name="col"]').forEach(cb => cb.checked = true);
}

function deselectAllColumns() {
    document.querySelectorAll('input[name="col"]').forEach(cb => cb.checked = false);
}
</script>

{% endblock %}
